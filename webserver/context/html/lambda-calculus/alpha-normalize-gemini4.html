<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ラムダ計算 アルファ正規化ツール</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --primary-color: #007bff;
            --primary-hover-color: #0056b3;
            --border-color: #dee2e6;
            --code-bg-color: #e9ecef;
            --error-color: #dc3545;
            --success-color: #28a745;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
        }

        p {
            text-align: center;
            margin-bottom: 2em;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-family: "SF Mono", "Consolas", "Courier New", monospace;
            font-size: 1.1em;
            box-sizing: border-box;
            resize: vertical;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0 20px 0;
            flex-wrap: wrap;
        }

        .examples {
            font-size: 0.9em;
        }

        .example-link {
            color: var(--primary-color);
            text-decoration: underline;
            cursor: pointer;
            margin-right: 15px;
        }

        .example-link:hover {
            color: var(--primary-hover-color);
        }

        button#run-button {
            padding: 10px 20px;
            font-size: 1.1em;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button#run-button:hover {
            background-color: var(--primary-hover-color);
        }

        .result-area {
            margin-top: 20px;
            display: none; /* Initially hidden */
        }

        .result-box {
            position: relative;
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            margin-top: 10px;
        }

        .result-box h2 {
            font-size: 1.1em;
            margin: 0;
            padding: 10px 15px;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            border-radius: 5px 5px 0 0;
        }

        .result-box pre {
            padding: 15px;
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .result-box code {
            font-family: "SF Mono", "Consolas", "Courier New", monospace;
            font-size: 1.1em;
            color: #333;
        }

        .copy-button {
            position: absolute;
            top: 8px;
            right: 10px;
            padding: 5px 10px;
            font-size: 0.8em;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .copy-button:hover {
            background-color: #5a6268;
        }
        
        .copy-button.copied {
            background-color: var(--success-color);
        }

        #error-message {
            color: var(--error-color);
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            padding: 10px;
            margin-top: 20px;
            display: none; /* Initially hidden */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ラムダ計算 アルファ正規化ツール</h1>
        <p>入力されたラムダ式をアルファ正規化し、式の構造を明確に表示します。</p>

        <label for="lambda-input">ラムダ式を入力してください:</label>
        <textarea id="lambda-input" placeholder="例: λf x. f (f x)"></textarea>

        <div class="controls">
            <div class="examples">
                入力例:
                <a class="example-link" data-example="λx.x">λx.x</a>
                <a class="example-link" data-example="λf x. f (f x)">λf x. f (f x)</a>
                <a class="example-link" data-example="(λx y. x) (λz.z) a">(λx y. x) (λz.z) a</a>
                <a class="example-link" data-example="λx.(x (λx.x))">λx.(x (λx.x))</a>
            </div>
            <button id="run-button">正規化を実行</button>
        </div>

        <div id="error-message"></div>

        <div id="result-area" class="result-area">
            <div class="result-box">
                <h2>略記なし（完全な括弧付け）</h2>
                <button class="copy-button" data-target="full-output-code">コピー</button>
                <pre><code id="full-output-code"></code></pre>
            </div>

            <div class="result-box">
                <h2>略記あり</h2>
                <button class="copy-button" data-target="short-output-code">コピー</button>
                <pre><code id="short-output-code"></code></pre>
            </div>
        </div>

    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {

        // --- AST (Abstract Syntax Tree) Node Classes ---
        // ASTノードのクラス定義
        class Var {
            constructor(name) { this.name = name; }
        }
        class Abs { // Abstraction
            constructor(param, body) { this.param = param; this.body = body; }
        }
        class App { // Application
            constructor(func, arg) { this.func = func; this.arg = arg; }
        }

        // --- Parser ---
        // 文字列をトークンに分解し、ASTを構築するパーサー
        class Parser {
            constructor(input) {
                // `\` を `λ` に統一
                this.tokens = input.replace(/\\/g, 'λ').match(/\(|\)|\.|λ|[a-zA-Z0-9_']+/g) || [];
                this.pos = 0;
            }

            // 次のトークンを覗き見する
            peek() { return this.tokens[this.pos]; }

            // 次のトークンを消費する
            consume() { return this.tokens[this.pos++]; }

            // 式のパースを開始する
            parse() {
                const expr = this.parseExpression();
                if (this.pos < this.tokens.length) {
                    throw new Error(`予期しないトークン "${this.peek()}" が見つかりました。`);
                }
                return expr;
            }

            // 式をパースする（左結合の適用を処理）
            parseExpression() {
                let expr = this.parseAtom();
                while (this.pos < this.tokens.length && this.peek() !== ')' && this.peek() !== '.') {
                    expr = new App(expr, this.parseAtom());
                }
                return expr;
            }

            // 基本的な構成要素（変数、ラムダ抽象、括弧付きの式）をパースする
            parseAtom() {
                const token = this.peek();
                if (token === '(') {
                    this.consume(); // '(' を消費
                    const expr = this.parseExpression();
                    if (this.consume() !== ')') {
                        throw new Error("括弧 ')' が閉じられていません。");
                    }
                    return expr;
                } else if (token === 'λ') {
                    this.consume(); // 'λ' を消費
                    const params = [];
                    while (this.peek() && this.peek() !== '.') {
                        const paramToken = this.consume();
                        if (!/^[a-zA-Z0-9_']+$/.test(paramToken)) {
                            throw new Error(`無効な変数名 "${paramToken}" です。`);
                        }
                        params.push(paramToken);
                    }
                    if (this.consume() !== '.') {
                        throw new Error("ラムダ抽象に '.' がありません。");
                    }
                    if (params.length === 0) {
                         throw new Error("ラムダ抽象に引数がありません。");
                    }
                    const body = this.parseExpression();
                    // λx y. M を λx.(λy.M) の形にネストさせる
                    return params.reduceRight((acc, param) => new Abs(param, acc), body);
                } else if (/^[a-zA-Z0-9_']+$/.test(token)) {
                    return new Var(this.consume());
                } else {
                    throw new Error(`無効なトークン "${token}" です。`);
                }
            }
        }

        // --- Alpha Normalizer ---
        // ASTを走査してアルファ正規化を行う
        function alphaNormalize(ast) {
            let counter = 0;
            // 再帰的に正規化するヘルパー関数
            function normalize(node, context) {
                if (node instanceof Var) {
                    // 束縛変数なら新しい名前に置換、自由変数ならそのまま
                    return context[node.name] ? new Var(context[node.name]) : node;
                } else if (node instanceof App) {
                    return new App(normalize(node.func, context), normalize(node.arg, context));
                } else if (node instanceof Abs) {
                    const newVarName = `v${counter++}`;
                    // 現在のスコープに新しい変数マッピングを追加
                    const newContext = { ...context, [node.param]: newVarName };
                    return new Abs(newVarName, normalize(node.body, newContext));
                }
                return node;
            }
            return normalize(ast, {});
        }

        // --- Formatters ---
        // ASTを文字列に変換するフォーマッター

        // 1. 完全な括弧付け形式
        function toFullString(ast) {
            if (ast instanceof Var) {
                return ast.name;
            } else if (ast instanceof App) {
                return `(${toFullString(ast.func)} ${toFullString(ast.arg)})`;
            } else if (ast instanceof Abs) {
                return `(λ${ast.param}.${toFullString(ast.body)})`;
            }
        }

        // 2. 略記あり形式
        function toShortString(ast, inApp = false) {
            if (ast instanceof Var) {
                return ast.name;
            } else if (ast instanceof App) {
                const funcStr = toShortString(ast.func, true);
                const argStr = toShortString(ast.arg, true);
                // 引数が適用の場合、括弧が必要: M (N P)
                const finalArgStr = (ast.arg instanceof App) ? `(${argStr})` : argStr;
                return `${funcStr} ${finalArgStr}`;
            } else if (ast instanceof Abs) {
                // ラムダ抽象をまとめる (λx.(λy.M) -> λx y.M)
                const params = [ast.param];
                let currentBody = ast.body;
                while (currentBody instanceof Abs) {
                    params.push(currentBody.param);
                    currentBody = currentBody.body;
                }
                const paramsStr = params.join(' ');
                const bodyStr = toShortString(currentBody, false);
                const result = `λ${paramsStr}.${bodyStr}`;
                // 適用の一部として現れる場合は括弧で囲む
                return inApp ? `(${result})` : result;
            }
        }

        // --- DOM Elements ---
        const inputEl = document.getElementById('lambda-input');
        const runButton = document.getElementById('run-button');
        const resultArea = document.getElementById('result-area');
        const errorEl = document.getElementById('error-message');
        const fullOutputEl = document.getElementById('full-output-code');
        const shortOutputEl = document.getElementById('short-output-code');
        const copyButtons = document.querySelectorAll('.copy-button');
        const exampleLinks = document.querySelectorAll('.example-link');

        // --- Event Handlers ---
        
        // 正規化実行ボタンのイベント
        runButton.addEventListener('click', () => {
            const inputText = inputEl.value.trim();
            if (!inputText) {
                errorEl.textContent = '式を入力してください。';
                errorEl.style.display = 'block';
                resultArea.style.display = 'none';
                return;
            }

            try {
                const parser = new Parser(inputText);
                const ast = parser.parse();
                const normalizedAst = alphaNormalize(ast);

                fullOutputEl.textContent = toFullString(normalizedAst);
                shortOutputEl.textContent = toShortString(normalizedAst);

                resultArea.style.display = 'block';
                errorEl.style.display = 'none';

            } catch (e) {
                errorEl.textContent = `エラー: ${e.message}`;
                errorEl.style.display = 'block';
                resultArea.style.display = 'none';
            }
        });
        
        // 入力例をクリックしたときのイベント
        exampleLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                inputEl.value = link.getAttribute('data-example');
                inputEl.focus();
            });
        });

        // コピーボタンのイベント
        copyButtons.forEach(button => {
            button.addEventListener('click', () => {
                const targetId = button.getAttribute('data-target');
                const textToCopy = document.getElementById(targetId).textContent;
                
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalText = button.textContent;
                    button.textContent = 'コピー完了!';
                    button.classList.add('copied');
                    setTimeout(() => {
                        button.textContent = originalText;
                        button.classList.remove('copied');
                    }, 1500);
                }).catch(err => {
                    console.error('コピーに失敗しました: ', err);
                });
            });
        });
    });
    </script>

</body>
</html>
