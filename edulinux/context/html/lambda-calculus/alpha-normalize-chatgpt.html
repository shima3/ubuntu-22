<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ラムダ式 アルファ正規化ツール</title>
  <style>
    body{font-family:system-ui, -apple-system, "Hiragino Kaku Gothic ProN", Meiryo, "Segoe UI", Roboto, sans-serif; padding:18px; background:#f7fbff; color:#0b1220}
    h1{font-size:20px;margin:0 0 10px}
    .box{background:white;border-radius:8px;padding:14px;box-shadow:0 6px 18px rgba(11,18,32,0.06);}
    textarea{width:100%;height:90px;font-family:monospace;font-size:14px;padding:10px;border:1px solid #e2e8f0;border-radius:6px}
    .row{display:flex;gap:10px;margin-top:10px}
    button{padding:8px 12px;border-radius:6px;border:1px solid #cbd5e1;background:#0ea5a3;color:white;cursor:pointer}
    button.secondary{background:#64748b}
    pre{background:#0f1724;color:#e6eef6;padding:12px;border-radius:6px;white-space:pre-wrap;font-family:monospace}
    .label{font-weight:600;margin-top:12px}
    .small{font-size:13px;color:#475569}
    .out{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .col{min-width:0}
    .controls{display:flex;gap:8px;align-items:center}
    .err{color:#b91c1c}
    .copy{background:#efefef;color:#0b1220;border:1px solid #d1d5db;padding:6px 10px;border-radius:6px}
    @media(max-width:760px){.out{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="box">
    <h1>ラムダ式 アルファ正規化ツール</h1>
    <div class="small">入力したラムダ式の<b>アルファ正規化</b>だけを行います。β簡約はしません。正確な変数捕捉を避けるため、束縛変数のみ一貫した新しい名前に置換します。</div>

    <div style="margin-top:12px">
      <label class="label">ラムダ式（入力例：<code>\x.x</code>、<code>λx y.x y</code>、<code>(\x. x) y</code>）</label>
      <textarea id="input" placeholder="例: λx. x y\nまたは: \x y. x (y z)">\x. x</textarea>
      <div class="row">
        <div style="flex:1" class="controls">
          <button id="run">正規化する</button>
          <button id="format" class="secondary">例を挿入</button>
        </div>
        <div style="flex-basis:240px;text-align:right" class="small">記法: <code>λ</code> または <code>\</code>。省略記法をサポート。</div>
      </div>

      <div id="error" class="err" aria-live="polite"></div>

      <div class="out">
        <div class="col box">
          <div class="label">略記なし（完全展開）</div>
          <div class="small">λx y.M → λx.λy.M / アプリケーションは明示的に括弧で示します</div>
          <pre id="expanded">-</pre>
          <div style="margin-top:8px"><button class="copy" data-target="expanded">コピー</button></div>
        </div>

        <div class="col box">
          <div class="label">略記あり（省略記法）</div>
          <div class="small">連続する λ はまとめて表示。アプリケーションは左結合で必要最小限の括弧。</div>
          <pre id="shorthand">-</pre>
          <div style="margin-top:8px"><button class="copy" data-target="shorthand">コピー</button></div>
        </div>
      </div>

    </div>
  </div>

  <script>
  // --- トークナイザ ---
  function tokenize(src){
    const tokens=[];
    let i=0;
    while(i<src.length){
      const c=src[i];
      if(/\s/.test(c)){i++;continue}
      if(c==='\\' || c==='λ'){tokens.push({type:'LAMBDA',val:c});i++;continue}
      if(c==='.' ){tokens.push({type:'DOT',val:'.'});i++;continue}
      if(c==='('||c===')'){tokens.push({type:c,val:c});i++;continue}
      // identifier: letters, digits, _, '?', '!' allowed
      const m = src.slice(i).match(/^[A-Za-z0-9_?!.]+/);
      if(m){tokens.push({type:'IDENT',val:m[0]}); i+=m[0].length; continue}
      // otherwise unrecognized char
      tokens.push({type:'CHAR',val:c});i++;
    }
    tokens.push({type:'EOF'});
    return tokens;
  }

  // --- パーサ: AST nodes ---
  function parse(src){
    const tokens=tokenize(src);
    let pos=0;
    function peek(){return tokens[pos]}
    function next(){return tokens[pos++]}

    function parseExpr(){
      if(peek().type==='LAMBDA') return parseLambda();
      return parseApplication();
    }

    function parseLambda(){
      next(); // consume λ
      const params=[];
      // read one or more identifiers until DOT
      while(peek().type==='IDENT'){
        params.push(next().val);
      }
      if(peek().type==='DOT'){
        next();
      } else {
        throw new Error('λ の後に "." が必要です（例: λx y. body）');
      }
      let body = parseExpr();
      // expand multiple params into nested lambdas
      for(let i=params.length-1;i>=0;i--){
        body = {type:'Lambda', param:params[i], body:body};
      }
      return body;
    }

    function parseAtom(){
      const t=peek();
      if(t.type==='IDENT'){ next(); return {type:'Var', name:t.val}; }
      if(t.type==='('){ next(); const e=parseExpr(); if(peek().type!==')') throw new Error('対応する ) がありません'); next(); return e; }
      throw new Error('予期しないトークン: '+JSON.stringify(t));
    }

    function parseApplication(){
      let node = parseAtom();
      // while next token starts an atom (IDENT or '(' or LAMBDA? A lambda here would be parsed as expression not atom; but application can have a lambda in argument if parenthesized)
      while(true){
        const t=peek();
        if(t.type==='IDENT' || t.type==='('){
          const right = parseAtom();
          node = {type:'App', left:node, right:right};
        } else {
          break;
        }
      }
      return node;
    }

    const ast = parseExpr();
    if(peek().type!=='EOF') throw new Error('入力の終わりに予期しないトークンがあります: '+JSON.stringify(peek()));
    return ast;
  }

  // --- ヘルパ: 自由変数の収集 ---
  function freeVars(node, bound=new Set(), out=new Set()){
    if(node.type==='Var'){
      if(!bound.has(node.name)) out.add(node.name);
    } else if(node.type==='Lambda'){
      bound.add(node.param);
      freeVars(node.body, bound, out);
      bound.delete(node.param);
    } else if(node.type==='App'){
      freeVars(node.left, bound, out);
      freeVars(node.right, bound, out);
    }
    return out;
  }

  // --- アルファ正規化 ---
  function alphaNormalize(ast){
    const free = freeVars(ast);
    const used = new Set(free);
    let counter=0;
    function fresh(){
      const letters='abcdefghijklmnopqrstuvwxyz';
      const base = letters[counter % letters.length];
      const times = Math.floor(counter/letters.length);
      counter++;
      return times===0 ? base : base+String(times);
    }

    function walk(node, env){
      if(node.type==='Var'){
        return {type:'Var', name: (env.hasOwnProperty(node.name)? env[node.name] : node.name)};
      }
      if(node.type==='App'){
        return {type:'App', left:walk(node.left, env), right:walk(node.right, env)};
      }
      if(node.type==='Lambda'){
        // generate fresh name not colliding with used
        let n;
        do{ n = fresh(); } while(used.has(n));
        used.add(n);
        const newEnv = Object.assign({}, env);
        newEnv[node.param] = n;
        const newBody = walk(node.body, newEnv);
        return {type:'Lambda', param:n, body:newBody};
      }
      throw new Error('不明なノード: '+JSON.stringify(node));
    }
    return walk(ast, {});
  }

  // --- 出力フォーマット ---
  // 略記なし: λx.λy.( (M N) N2 ) -  なるべく括弧で明示
  function toExpanded(node){
    if(node.type==='Var') return node.name;
    if(node.type==='Lambda'){
      return 'λ'+node.param+'.'+toExpanded(node.body);
    }
    if(node.type==='App'){
      return '('+toExpanded(node.left)+' '+toExpanded(node.right)+')';
    }
  }

  // 略記あり: 連続するラムダをまとめ、アプリケーションは左結合で必要最小限の括弧
  function toShorthand(node){
    function collectLambdas(n, params){
      if(n.type==='Lambda'){ params.push(n.param); return collectLambdas(n.body, params); }
      return {params, body:n};
    }
    function needsParensInAppLeft(n){ return n.type==='App'; }
    function needsParensInAppRight(n){ return n.type==='App' || n.type==='Lambda'; }

    if(node.type==='Var') return node.name;
    if(node.type==='Lambda'){
      const {params, body} = collectLambdas(node, []);
      return 'λ'+params.join(' ') + '.' + toShorthand(body);
    }
    if(node.type==='App'){
      const left = node.left;
      const right = node.right;
      const leftS = needsParensInAppLeft(left)? '('+toShorthand(left)+')' : toShorthand(left);
      const rightS = needsParensInAppRight(right)? '('+toShorthand(right)+')' : toShorthand(right);
      return leftS + ' ' + rightS;
    }
  }

  // --- イベント ---
  document.getElementById('run').addEventListener('click', ()=>{
    const src = document.getElementById('input').value.trim();
    const errEl = document.getElementById('error'); errEl.textContent='';
    if(!src){ document.getElementById('expanded').textContent='-'; document.getElementById('shorthand').textContent='-'; return; }
    try{
      const ast = parse(src);
      const normalized = alphaNormalize(ast);
      const expanded = toExpanded(normalized);
      const shorthand = toShorthand(normalized);
      document.getElementById('expanded').textContent = expanded;
      document.getElementById('shorthand').textContent = shorthand;
    }catch(e){
      document.getElementById('expanded').textContent='-'; document.getElementById('shorthand').textContent='-';
      errEl.textContent = 'パースエラー: ' + e.message;
    }
  });

  document.getElementById('format').addEventListener('click', ()=>{
    const sample = [
      'λx. x',
      '\\x y. x y',
      'λx. (λy. x y) z',
      '(\\x. x x) (\\y. y)'
    ];
    document.getElementById('input').value = sample.join('\n');
  });

  // コピー機能
  document.querySelectorAll('.copy').forEach(btn=> btn.addEventListener('click', ()=>{
    const target = document.getElementById(btn.dataset.target).textContent;
    navigator.clipboard && navigator.clipboard.writeText(target).then(()=>{ btn.textContent='コピー済み'; setTimeout(()=>btn.textContent='コピー',900); }).catch(()=>{ alert('コピーに失敗しました。手動で選択してください。'); });
  }));

  // 実行時に初期化
  document.getElementById('run').click();
  </script>
</body>
</html>
