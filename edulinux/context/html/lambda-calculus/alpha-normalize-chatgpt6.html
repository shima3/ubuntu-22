<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ラムダ式アルファ正規化ツール（単一ファイル）</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;margin:20px;background:#f7f7fb;color:#111}
  .container{max-width:980px;margin:0 auto}
  h1{font-size:20px;margin-bottom:6px}
  p.lead{margin-top:0;color:#333}
  textarea{width:100%;height:140px;padding:10px;font-family:monospace;font-size:14px;border:1px solid #cfd6e3;border-radius:6px;box-sizing:border-box}
  .row{display:flex;gap:12px;align-items:flex-start}
  .col{flex:1}
  button.primary{background:#2563eb;color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer}
  button.example{background:#eef2ff;color:#1f2937;border:1px solid #c7d2fe;padding:6px 8px;border-radius:6px;cursor:pointer;margin-right:6px}
  .results{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .card{background:#fff;padding:12px;border-radius:8px;border:1px solid #e6edf6;position:relative;min-height:80px}
  .card h3{margin:0 0 8px 0;font-size:14px}
  .card pre{white-space:pre-wrap;font-family:monospace;font-size:13px;margin:0}
  .copy-btn{position:absolute;right:10px;top:10px;background:#f1f5f9;border:1px solid #d1d5db;padding:6px 8px;border-radius:6px;cursor:pointer}
  .error{color:#b91c1c;background:#fff4f4;padding:8px;border:1px solid #fecaca;border-radius:6px;margin-top:8px}
  .examples{margin-top:8px}
  .hint{font-size:13px;color:#374151;margin-top:8px}
  footer{margin-top:18px;font-size:12px;color:#6b7280}
</style>
</head>
<body>
<div class="container">
  <h1>ラムダ式アルファ正規化ツール</h1>
  <p class="lead">入力したラムダ式をアルファ正規化し、（1）完全な括弧付け、（2）略記あり の2形式で表示します。ベータ簡約は一切行いません。構文エラー時はエラーメッセージを表示します。</p>

  <label for="input">ラムダ式の入力（例: λf x.f (f x) または \x.x）</label>
  <textarea id="input" spellcheck="false">λf x.f (f x)</textarea>
  <div style="margin-top:8px;display:flex;align-items:center;gap:8px">
    <button id="run" class="primary">正規化する</button>
    <div class="examples">
      <button class="example" data-insert="λx.x">λx.x</button>
      <button class="example" data-insert="λf x.f (f x)">λf x.f (f x)</button>
      <button class="example" data-insert="(λx.x) y">(λx.x) y</button>
      <button class="example" data-insert="λx.λy.x y">λx.λy.x y</button>
      <button class="example" data-insert="(λx.x x) (λx.x x)">(λx.x x) (λx.x x)</button>
    </div>
  </div>
  <div id="error" class="error" style="display:none"></div>

  <div class="results">
    <div class="card">
      <h3>略記なし（完全な括弧付け）
        <button class="copy-btn" id="copy-full">コピー</button>
      </h3>
      <pre id="out-full">(結果はここに表示されます)</pre>
    </div>
    <div class="card">
      <h3>略記あり
        <button class="copy-btn" id="copy-short">コピー</button>
      </h3>
      <pre id="out-short">(結果はここに表示されます)</pre>
    </div>
  </div>

  <p class="hint">ルール: ラムダは λ または \ で書けます。複数引数は <code>λx y.M</code> のように書けます。適用は左結合（<code>M N P</code> = <code>((M N) P)</code>）。</p>
  <footer>作成者: Web開発者ツール — アルファ正規化のみ。自由変数は名前を保持します。</footer>
</div>

<script>
// Parser + AST + alpha-normalizer + printers

function tokenize(src){
  const tokens=[];
  let i=0;
  while(i<src.length){
    const ch=src[i];
    if(/\s/.test(ch)){ i++; continue }
    if(ch==='('||ch===')'||ch==='.' ) { tokens.push({type:ch}); i++; continue }
    if(ch==='λ' || ch==='\\') { tokens.push({type:'lambda'}); i++; continue }
    // identifier: letters, digits, underscore, apostrophe
    if(/[A-Za-z0-9_']/.test(ch)){
      let j=i+1; while(j<src.length && /[A-Za-z0-9_']/.test(src[j])) j++;
      tokens.push({type:'ident', value:src.slice(i,j)});
      i=j; continue;
    }
    throw new Error('無効な文字: "'+ch+'"');
  }
  return tokens;
}

// AST constructors
function Var(name){ return {tag:'var', name} }
function Abs(param, body){ return {tag:'abs', param, body} }
function App(left,right){ return {tag:'app', left, right} }

// Recursive descent parser implementing rules
function parse(src){
  const tokens=tokenize(src);
  let pos=0;
  function peek(){ return tokens[pos] }
  function consume(){ return tokens[pos++] }

  function parseTerm(){
    // term := atom { atom }  left-assoc application (we'll handle application in parseExpr)
    const atom=parseAtom();
    return atom;
  }

  function parseAtom(){
    const t=peek();
    if(!t) throw new Error('予期しない入力の終わり');
    if(t.type==='('){ consume(); const e=parseExpr(); if(!peek()||peek().type!==')') throw new Error('対応する ) がありません'); consume(); return e }
    if(t.type==='lambda'){
      consume();
      // expect one or more id
      const params=[];
      while(peek() && peek().type==='ident'){
        params.push(consume().value);
      }
      if(params.length===0) throw new Error('λの後にパラメータが必要です');
      if(!peek() || peek().type!=='.') throw new Error('λの後にドット "." が必要です');
      consume();
      // parse body: since lambdas extend to the end, parseExpr will treat following tokens as body
      let body=parseExpr();
      // multiple params => nested lambdas
      for(let i=params.length-1;i>=0;i--) body=Abs(params[i], body);
      return body;
    }
    if(t.type==='ident'){ return Var(consume().value) }
    throw new Error('予期しないトークン: '+JSON.stringify(t));
  }

  // parseExpr implements left-assoc application: parse a sequence of atoms and fold into apps
  function parseExpr(){
    // parse first factor
    let node;
    // If next token is lambda or '(' or ident
    if(!peek()) throw new Error('式が期待されます');
    node=parseAtom();
    while(peek() && (peek().type==='('|| peek().type==='ident' || peek().type==='lambda')){
      // next is another atom -> application
      const right=parseAtom();
      node=App(node,right);
    }
    return node;
  }

  const root=parseExpr();
  if(pos<tokens.length) throw new Error('未処理のトークンがあります');
  return root;
}

// Alpha-normalizer
function alphaNormalize(ast){
  let counter=0;
  function fresh(){ return 'v'+(counter++) }
  // mapping stack: array of maps for nested scopes; but simpler: single map plus stack of bound names
  const stack=[]; // array of maps

  function walk(node){
    if(node.tag==='var'){
      // find mapping from topmost scope to bottom
      for(let i=stack.length-1;i>=0;i--){ if(stack[i].hasOwnProperty(node.name)) return Var(stack[i][node.name]) }
      // free var -> keep original name
      return Var(node.name);
    }
    if(node.tag==='abs'){
      const newName=fresh();
      // create mapping for this lambda's param
      const m={}; m[node.param]=newName; stack.push(m);
      const newBody=walk(node.body);
      stack.pop();
      return Abs(newName, newBody);
    }
    if(node.tag==='app'){
      return App(walk(node.left), walk(node.right));
    }
    throw new Error('不明なASTタグ: '+node.tag);
  }
  return walk(ast);
}

// Printers
function printFull(node){
  if(node.tag==='var') return node.name;
  if(node.tag==='abs') return '('+ 'λ'+node.param+'.'+ printFull(node.body) +')';
  if(node.tag==='app') return '('+ printFull(node.left) + ' ' + printFull(node.right) +')';
}

// Short form printer obeying the rules in the spec
function printShort(node){
  // helpers to flatten nested lambdas and left-assoc apps
  function gatherLambdas(n, acc){
    if(n.tag==='abs'){ acc.push(n.param); return gatherLambdas(n.body, acc) }
    return {params:acc, body:n};
  }
  function gatherApps(n, acc){
    // left-assoc apps: ((a b) c) => [a,b,c]
    if(n.tag==='app'){
      gatherApps(n.left, acc);
      acc.push(n.right);
      return acc;
    }
    acc.push(n);
    return acc;
  }

  function needsParenInAppAsFunction(n){
    return n.tag==='abs';
  }
  function needsParenInAppAsArg(n){
    return n.tag==='abs' || n.tag==='app' && (n.left && n.left.tag==='abs');
  }

  function rec(n){
    if(n.tag==='var') return n.name;
    if(n.tag==='abs'){
      // flatten
      const res=gatherLambdas(n, []);
      const params=res.params;
      const body=res.body;
      return 'λ'+params.join(' ') +'.' + rec(body);
    }
    if(n.tag==='app'){
      // flatten into sequence
      const elems=gatherApps(n, []);
      // print first element
      let out='';
      for(let i=0;i<elems.length;i++){
        const e=elems[i];
        let s=rec(e);
        // apply parentheses rules: if the element is an abstraction and it appears as a function or argument in application, we must wrap it in ()
        if(e.tag==='abs') s='('+s+')';
        // additionally, if e is an app whose left is abs and it appears as an argument, parentheses may be needed
        // But rules specified only require parentheses when an abstraction appears as function or argument. We'll keep minimal.
        out += (i? ' ' : '') + s;
      }
      return out;
    }
  }
  return rec(node);
}

// Utilities: copy button feedback
function withCopyFeedback(btn, textGetter){
  btn.addEventListener('click', async ()=>{
    const orig=btn.textContent;
    try{
      await navigator.clipboard.writeText(textGetter());
      btn.textContent='Copied!';
    }catch(e){
      btn.textContent='Error';
    }
    setTimeout(()=>btn.textContent=orig,900);
  })
}

// Wire UI
const runBtn=document.getElementById('run');
const inputEl=document.getElementById('input');
const outFull=document.getElementById('out-full');
const outShort=document.getElementById('out-short');
const errorEl=document.getElementById('error');
const copyFull=document.getElementById('copy-full');
const copyShort=document.getElementById('copy-short');

withCopyFeedback(copyFull, ()=>outFull.textContent);
withCopyFeedback(copyShort, ()=>outShort.textContent);

// examples
document.querySelectorAll('.example').forEach(b=>{
  b.addEventListener('click', ()=>{ inputEl.value=b.dataset.insert; errorEl.style.display='none'; });
});

runBtn.addEventListener('click', ()=>{
  const src=inputEl.value.trim();
  errorEl.style.display='none';
  outFull.textContent=''; outShort.textContent='';
  if(!src){ errorEl.style.display='block'; errorEl.textContent='入力が空です'; return }
  try{
    const ast=parse(src);
    const normalized=alphaNormalize(ast);
    const full=printFull(normalized);
    const short=printShort(normalized);
    outFull.textContent=full;
    outShort.textContent=short;
  }catch(e){
    errorEl.style.display='block';
    errorEl.textContent='構文エラー: '+e.message;
  }
});

// run once at load
runBtn.click();
</script>
</body>
</html>
