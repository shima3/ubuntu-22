[sssd]
config_file_version = 2
services = nss, pam
domains = default
user = root

[nss]
homedir_substring = /home

[pam]

[domain/default]
id_provider = ldap
auth_provider = ldap
access_provider = permit
chpass_provider = ldap

# ldap_uri = ldap://ldap.internal
ldap_uri = ldaps://ldap.internal
ldap_tls_cacert = /etc/sssd/certs/ca.crt

# dns_discovery_domain = none
ldap_search_base = dc=example,dc=local

# 2. 最初からオンラインとして動作させる
# remote_id_provider = ldap
# オフライン判定を緩くする
# ldap_network_timeout = 15
# offline_timeout = 1

# ldap_user_search_base = ou=people,dc=example,dc=local
# ldap_group_search_base = ou=groups,dc=example,dc=local

# ユーザ属性（posixAccount 前提）
ldap_schema = rfc2307
ldap_pwd_policy = none
ldap_user_object_class = posixAccount
ldap_user_name = uid
ldap_user_uid_number = uidNumber
ldap_user_gid_number = gidNumber
ldap_user_home_directory = homeDirectory
ldap_user_shell = loginShell

ldap_user_shadow_last_change = shadowLastChange
ldap_user_shadow_min = shadowMin
ldap_user_shadow_max = shadowMax
ldap_user_shadow_warning = shadowWarning

ldap_group_object_class = posixGroup
ldap_group_name = cn
ldap_group_gid_number = gidNumber
ldap_group_member = memberUid

# バインド用アカウント
ldap_default_bind_dn = cn=admin,dc=example,dc=local
ldap_default_authtok = ${LDAP_ADMIN_PASSWORD}
# ldap_default_authtok_type = password

# TLS
# ldap_id_use_start_tls = True
# ldaps:// を使うなら start_tls は False (最初から暗号化されているため)
ldap_id_use_start_tls = False
# ldap_auth_disable_tls_never_use_in_production = False
# ldap_tls_reqcert = hard
ldap_tls_reqcert = demand
# ldap_id_use_start_tls = False
# ldap_auth_disable_tls_never_use_in_production = True
# 自己署名証明書などで検証をスキップする場合（テスト用）
# ldap_tls_reqcert = allow
# ldap_tls_reqcert = never

# サーバーへの最小接続レベルを「普通」にする（暗号化を要求させない）
# ldap_min_id = 100

cache_credentials = True
enumerate = False

ldap_tls_cipher_suite = NORMAL:-VERS-TLS1.3
